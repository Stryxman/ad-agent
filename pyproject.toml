[project]
name = "ad-agent"
version = "0.1.0"
description = "Agent IA qui transforme un brief en variantes d'ads statiques à partir d'une base de formats."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
render = ["playwright>=1.40"]
llm = ["anthropic>=1.0"]
assets = ["rembg>=2.0", "pillow>=10.0", "onnxruntime>=1.20"]

[project.scripts]
ad-agent = "agent.cli:main"

[tool.setuptools]
packages = ["agent"]

[tool.setuptools.package-data]
agent = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
