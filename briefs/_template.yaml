# Brief — copier ce fichier en <nom_du_produit>.yaml

name: Nom de la campagne
brand: ""                 # nom de marque affiché en logotype
niche: autre                 # tech | beaute | mode | sante_bien_etre | animaux | autre
objective: conversion        # conversion | awareness | traffic | lead

product:
  name: ""
  description: ""
  benefits:                  # 1 à 5 bénéfices concrets
    - ""
  price: null
  compare_at_price: null    # ancien prix réel (format prix barré)

audience: "Qui, âge, situation, problème principal"
offer: null                  # ex. "-20 % sur la première commande"

da:                          # direction artistique
  palette: ["#000000"]       # couleur principale en premier
  fonts: []
  tone: "ex. chaleureux, premium, direct"
  dos: []
  donts: []
  fond: auto               # auto | lineaire | mesh | uni (auto = celui de chaque format)

hook_idea: null              # angle imposé ; sinon l'agent propose

ratios: ["4:5"]              # 1:1 | 4:5 | 9:16 | 16:9
language: fr
forbidden_claims: []         # promesses interdites (santé, résultats chiffrés...)

assets:
  - path: assets/products/exemple.png
    description: "packshot fond blanc"

variants_count: 6

testimonials: []             # avis clients RÉELS : [{text, author, rating}] — jamais inventés
