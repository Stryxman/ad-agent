{% extends "_base.html" %}
{% block style %}
<style>
  .canvas { position: relative; padding: 0; justify-content: flex-start; background: {{ bg_surface_css }}; color: {{ on_bg }}; overflow: hidden;
            /* texte blanc sur photo assombrie ; sans photo, la couleur lisible de la surface accent */
            --txt: {{ '#fff' if scene_img else on_accent_surface }};
            --shadow: {{ '1' if scene_img else '0' }}; }
  .scene { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 55%;
           background: linear-gradient(to top, rgba(0,0,0,.65), rgba(0,0,0,0)); }
  /* voile haut : la marque et le titre sont blancs, posés en haut de la photo (illisibles sur photo claire) */
  .scrim-top { position: absolute; left: 0; right: 0; top: 0; height: 62%;   /* jusqu'au titre, placé à mi-hauteur */
               background: linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,.38) 70%, rgba(0,0,0,0)); }
  .content { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; flex-direction: column;
             justify-content: space-between; box-sizing: border-box;
             padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left); }
  .logo { color: var(--txt); text-shadow: 0 1px 6px rgba(0,0,0,calc(.5 * var(--shadow))); }
  h1 { color: var(--txt); font-size: calc(var(--u) * 6.4); line-height: 1.15;
       text-shadow: 0 2px 10px rgba(0,0,0,calc(.55 * var(--shadow)));
       max-width: 90%; margin: 0 auto; text-align: center; }
  .bottom { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 2); }
  .offer { color: #fff; font-size: calc(var(--u) * 3.6); background: rgba(0,0,0,.35); padding: calc(var(--u) * 1.4) calc(var(--u) * 3.6);
           border-radius: 999px; }
  .ph-scene { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
              background: {{ accent_surface_css }}; color: {{ on_accent_surface }}; font-size: calc(var(--u) * 4); }
  /* élément clé : dans le flux du bas de contenu (au-dessus de l'offre), donc toujours hors bande basse */
  .product-inset { align-self: flex-end; width: calc(var(--u) * 16); height: calc(var(--u) * 16); }
  .product-inset img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.35)); }
</style>
{% endblock %}
{% block body %}
<div class="canvas">
  {% if scene_img %}<img class="scene" src="{{ scene_img }}" alt="{{ product_name }}">
  {% else %}<div class="ph-scene">{{ product_name }}</div>{% endif %}
  {% if scene_img %}<div class="scrim"></div><div class="scrim-top"></div>{% endif %}
  <div class="content">
    <div class="logo brand">{{ brand }}</div>
    <h1 class="display">{{ z.headline }}</h1>
    <div class="bottom">
      {% if product_img %}<div class="product-inset"><img src="{{ product_img }}" alt="{{ product_name }}"></div>{% endif %}
      {% if z.offer_line %}<span class="offer">{{ z.offer_line }}</span>{% endif %}
    </div>
  </div>
</div>
{% endblock %}
