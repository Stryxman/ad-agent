<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>{{ brand }} — {{ fmt_id }} {{ ratio }}</title>
<style>
  :root { --u: {{ u }}px; --bg: {{ bg }}; --fg: {{ fg }}; --accent: {{ accent }}; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: {{ w }}px; height: {{ h }}px; overflow: hidden; }
  body { font-family: "{{ font_body }}", Helvetica, Arial, sans-serif; }
  .canvas { width: {{ w }}px; height: {{ h }}px; padding: calc(var(--u) * 7); display: flex; flex-direction: column;
            align-items: center; text-align: center; overflow: hidden; }
  .display { font-family: "{{ font_display }}", Georgia, serif; }
  .brand { font-family: "{{ font_display }}", Georgia, serif; font-size: calc(var(--u) * 4.2); letter-spacing: .18em;
           text-transform: uppercase; font-weight: 700; }
  .stage { flex: 1; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .ph { width: 42%; height: 88%; border: calc(var(--u) * .4) dashed currentColor; opacity: .5; border-radius: calc(var(--u) * 2);
        display: flex; align-items: center; justify-content: center; padding: calc(var(--u) * 3);
        font-size: calc(var(--u) * 3.2); }
  .cta { display: inline-block; padding: calc(var(--u) * 2) calc(var(--u) * 5); border-radius: 999px;
         font-size: calc(var(--u) * 3.4); font-weight: 600; }
</style>
{% block style %}{% endblock %}
</head>
<body>
{% macro product() %}
  <div class="stage">
    {% if product_img %}<img src="{{ product_img }}" alt="{{ product_name }}">
    {% else %}<div class="ph">{{ product_name }}</div>{% endif %}
  </div>
{% endmacro %}
{% block body %}{% endblock %}
</body>
</html>
